<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MP3 剪接器</title>
<style>
/* 版面概念：一台剪帶台。上方是波形（要下刀的帶子），下方是接好的成品帶，斜角接點與黃色接合膠帶取自實體剪帶。 */
:root {
  --bg:#e6ebee; --panel:#f6f8f9; --ink:#17232c; --muted:#556570; --line:#c5d0d7;
  --wave:#1f6f86; --mark:#f2b705; --mark-ink:#2a2000; --head:#d23b2e; --shade:rgba(230,235,238,.72);
  --tape1:#1f6f86; --tape2:#6b5b95; --tape3:#3f7d4e; --tape4:#a65a2e;
  --sans:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg:#131a20; --panel:#1b242c; --ink:#e4ebef; --muted:#9aaab5; --line:#31404b;
  --wave:#6cc5d9; --mark:#f5c518; --mark-ink:#2a2000; --head:#ff6a5a; --shade:rgba(19,26,32,.72);
  --tape1:#3b93aa; --tape2:#8d7cba; --tape3:#5ba06c; --tape4:#c47a48;
  color-scheme:dark;
} }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
.page{max-width:1280px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.02em}
h2{margin:0;font-size:15px;font-weight:700}
.note{color:var(--muted);font-size:13px}
.spacer{flex:1}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;
  padding:6px 12px;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){border-color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--mark);outline-offset:1px}
button.primary{background:var(--mark);border-color:var(--mark);color:var(--mark-ink);font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{display:flex;align-items:center;border:1px solid var(--line);border-radius:4px;background:var(--panel);min-width:0}
.tab button{border:0;background:none;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.tab.on{border-color:var(--ink);font-weight:700}
.tab .x{padding-inline:8px;color:var(--muted)}
.deck{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:10px;min-width:0}
.meta{font:12px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.stage{position:relative;height:240px;touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{cursor:crosshair}
.empty{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;text-align:center;
  border:2px dashed var(--line);border-radius:4px;padding:16px}
.empty strong{font-size:17px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.field{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.field input{font:13px var(--mono);width:108px;padding:6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.field input#outName{font:inherit;width:min(300px,60vw)}
.sel-len{font:13px var(--mono);font-variant-numeric:tabular-nums}
#pan{width:100%;margin:0}
.strip{position:relative;display:flex;gap:3px;height:34px;overflow:hidden;background:var(--bg);border-radius:3px}
.strip i{display:block;min-width:4px;transform:skewX(-32deg)}
.strip i:first-child{margin-left:-12px;padding-left:12px}
.strip i:last-of-type{margin-right:-12px;padding-right:12px}
#stripHead{position:absolute;top:0;bottom:0;width:2px;background:var(--head)}
.clips{list-style:none;margin:0;padding:0;display:grid}
.clips li{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;align-items:center;gap:10px;
  padding:6px 4px;border-top:1px solid var(--line)}
.clips li.now{background:color-mix(in srgb,var(--mark) 22%,transparent)}
.clips li.over{box-shadow:inset 0 2px 0 var(--mark)}
.clips .n{font:13px var(--mono);color:var(--muted);text-align:right}
.clips .name{background:none;border:0;padding:0;text-align:left;overflow:hidden;text-overflow:ellipsis}
.clips .name:hover{text-decoration:underline}
.clips .time{font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.clips .ops{display:flex;gap:4px}
.clips .ops button{padding:2px 8px}
#status{min-height:21px;font-size:13px}
#status.err{color:var(--head);font-weight:700}
kbd{font:12px var(--mono);border:1px solid var(--line);border-radius:3px;padding:0 4px}
body.dropping section:first-of-type{outline:3px solid var(--mark)}
@media (max-width:640px){
  .stage{height:170px}
  .clips li{grid-template-columns:24px minmax(0,1fr) auto}
  .clips .time{grid-column:2;grid-row:2}
  .clips .ops{grid-column:3;grid-row:1 / span 2}
}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>MP3 剪接器</h1>
    <span class="note">不重新編碼，音質不變。檔案只在這台電腦處理。</span>
    <span class="spacer"></span>
    <button id="open" class="primary">開啟 MP3</button>
    <input id="file" type="file" accept=".mp3,audio/mpeg" multiple hidden>
  </header>

  <nav class="tabs" id="tabs" aria-label="已開啟的檔案"></nav>

  <section class="deck" aria-label="波形">
    <div class="meta" id="meta">尚未開啟檔案</div>
    <div class="stage" id="stage">
      <canvas id="wave"></canvas>
      <canvas id="ov" aria-label="波形，拖曳選取範圍"></canvas>
      <div class="empty" id="empty">
        <strong>把 MP3 拖到這裡</strong>
        <span class="note">可一次放多個檔案，從不同檔案取片段接在一起</span>
      </div>
    </div>
    <div id="panWrap" hidden><input id="pan" type="range" min="0" max="1000" value="0" aria-label="左右移動波形"></div>
    <div class="row">
      <button id="play" disabled>▶ 播放</button>
      <button id="playSel" disabled>試聽選取</button>
      <span class="field"><label for="in">起點</label><input id="in" disabled spellcheck="false" autocomplete="off"></span>
      <span class="field"><label for="out">終點</label><input id="out" disabled spellcheck="false" autocomplete="off"></span>
      <span class="sel-len" id="selLen"></span>
      <span class="spacer"></span>
      <button id="zoomIn" disabled title="放大">＋</button>
      <button id="zoomOut" disabled title="縮小">－</button>
      <button id="zoomSel" disabled>放大選取</button>
      <button id="zoomAll" disabled>全部</button>
    </div>
    <div class="row">
      <button id="add" class="primary" disabled>加入選取範圍</button>
      <button id="addRest" disabled>挖掉選取，保留前後</button>
      <span class="note">拖曳選範圍，滾輪縮放。<kbd>空白鍵</kbd> 播放 <kbd>I</kbd> <kbd>O</kbd> 設起終點 <kbd>A</kbd> 加入 <kbd>←</kbd> <kbd>→</kbd> 移一個音框</span>
    </div>
  </section>

  <section class="deck" aria-label="成品">
    <div class="row">
      <h2>成品</h2>
      <span class="sel-len" id="total"></span>
    </div>
    <div class="strip" id="strip"></div>
    <ol class="clips" id="clips"></ol>
    <p class="note" id="noClips" style="margin:0">還沒有片段。在波形上選好範圍，按「加入選取範圍」。</p>
    <div class="row">
      <span class="field"><label for="outName">檔名</label><input id="outName" spellcheck="false" autocomplete="off"></span>
      <button id="preview" disabled>試聽成品</button>
      <button id="export" class="primary" disabled>匯出 MP3</button>
      <span class="note">歌曲資訊（ID3 標籤）不會帶到成品。</span>
    </div>
  </section>

  <div id="status" role="status" aria-live="polite"></div>
</div>

<script>
'use strict';
/*CORE*/
const BR1=[0,32,40,48,56,64,80,96,112,128,160,192,224,256,320];
const BR2=[0,8,16,24,32,40,48,56,64,80,96,112,128,144,160];
const RATES={3:[44100,48000,32000],2:[22050,24000,16000],0:[11025,12000,8000]};

function readHeader(b,o){
  if(o+4>b.length||b[o]!==0xFF||(b[o+1]&0xE0)!==0xE0) return null;
  const ver=(b[o+1]>>3)&3, layer=(b[o+1]>>1)&3;
  if(ver===1||layer!==1) return null;
  const brI=b[o+2]>>4, srI=(b[o+2]>>2)&3;
  if(brI===0||brI===15||srI===3) return null;
  const mpeg1=ver===3, mode=b[o+3]>>6, mono=mode===3, crc=!(b[o+1]&1);
  const kbps=(mpeg1?BR1:BR2)[brI], sr=RATES[ver][srI];
  const size=Math.floor((mpeg1?144:72)*kbps*1000/sr)+((b[o+2]>>1)&1);
  const si=mpeg1?(mono?17:32):(mono?9:17);
  return {ver,mpeg1,mode,mono,crc,brI,srI,kbps,sr,size,si,siOff:4+(crc?2:0),spf:mpeg1?1152:576};
}
const sameStream=(a,b)=>a.ver===b.ver&&a.sr===b.sr&&a.mono===b.mono;
const ascii=(b,o,n)=>String.fromCharCode(...b.subarray(o,o+n));

// 找出所有音框。略過 ID3v2、Xing/Info/VBRI 標頭（裡面的統計值剪完就不對了）與檔尾標籤。
function parseMp3(b){
  let o=0;
  while(o+10<=b.length&&ascii(b,o,3)==='ID3'){
    const n=(b[o+6]&127)*2097152+(b[o+7]&127)*16384+(b[o+8]&127)*128+(b[o+9]&127);
    o+=10+n+(b[o+5]&16?10:0);
  }
  const offs=[], sizes=[]; let ref=null, expected=-1;
  while(o+4<=b.length){
    const h=readHeader(b,o);
    if(!h||(ref&&!sameStream(h,ref))||o+h.size>b.length){o++;continue}
    if(o!==expected){
      const next=o+h.size;
      if(next+4<=b.length){
        const nh=readHeader(b,next);
        if(!nh||!sameStream(nh,h)){o++;continue}
      }
    }
    if(!ref){
      ref=h;
      const p=o+h.siOff+h.si;
      const tag=p+4<=b.length?ascii(b,p,4):'';
      const vbri=o+40<=b.length?ascii(b,o+36,4):'';
      if(tag==='Xing'||tag==='Info'||vbri==='VBRI'){o+=h.size;expected=o;continue}
    }
    offs.push(o);sizes.push(h.size);o+=h.size;expected=o;
  }
  if(!ref||!offs.length) return null;
  const n=offs.length, frameDur=ref.spf/ref.sr;
  let bytes=0; for(let i=0;i<n;i++) bytes+=sizes[i];
  return {bytes:b,offs:Uint32Array.from(offs),sizes:Uint16Array.from(sizes),first:ref,
    sr:ref.sr,mono:ref.mono,ver:ref.ver,spf:ref.spf,frameDur,n,dur:n*frameDur,
    kbps:Math.round(bytes*8/(n*frameDur)/1000)};
}

function crc16(b,start,end,crc){
  for(let i=start;i<end;i++){
    let d=b[i]<<8;
    for(let k=0;k<8;k++){
      crc=((crc^d)&0x8000)?((crc<<1)^0x8005)&0xFFFF:(crc<<1)&0xFFFF;
      d=(d<<1)&0xFFFF;
    }
  }
  return crc;
}

// 把音框的邊資訊清零，這一格會解成靜音，但主資料仍留在位元庫裡給後面的音框用。
function silenceFrame(out,p,h){
  const a=p+4+(h.crc?2:0);
  out.fill(0,a,a+h.si);
  if(h.crc){
    const c=crc16(out,a,a+h.si,crc16(out,p+2,p+4,0xFFFF));
    out[p+4]=c>>8;out[p+5]=c&255;
  }
}

function xingSize(h){
  const table=h.mpeg1?BR1:BR2, need=4+h.si+116;
  for(let i=1;i<15;i++){
    const bytes=Math.floor((h.mpeg1?144:72)*table[i]*1000/h.sr);
    if(bytes>=need) return {brI:i,size:bytes};
  }
  return null;
}

function writeXing(out,h,x,frames,total,starts,cbr){
  out[0]=0xFF;out[1]=0xE0|(h.ver<<3)|2|1;out[2]=(x.brI<<4)|(h.srI<<2);out[3]=h.mode<<6;
  let p=4+h.si;
  const put=s=>{for(const c of s)out[p++]=c.charCodeAt(0)};
  const u32=v=>{out[p++]=v>>>24;out[p++]=(v>>>16)&255;out[p++]=(v>>>8)&255;out[p++]=v&255};
  put(cbr?'Info':'Xing');u32(7);u32(frames);u32(total);
  for(let i=0;i<100;i++){
    const f=Math.min(frames-1,Math.floor(i/100*frames));
    out[p++]=Math.min(255,Math.floor(starts[f]/total*256));
  }
}

// 核心：照順序複製音框。片段開頭若引用到片段之前的位元庫資料，該格改成靜音，避免接點爆音。
function buildExport(clips){
  const h0=clips[0].src.first, x=xingSize(h0);
  let frames=0, total=x?x.size:0;
  for(const c of clips){
    frames+=c.b-c.a;
    for(let i=c.a;i<c.b;i++) total+=c.src.sizes[i];
  }
  const out=new Uint8Array(total), starts=new Uint32Array(frames);
  let p=x?x.size:0, k=0, cbr=true, muted=0, brRef=-1;
  for(const c of clips){
    const s=c.src, b=s.bytes; let avail=0;
    for(let i=c.a;i<c.b;i++){
      const o=s.offs[i], len=s.sizes[i], h=readHeader(b,o);
      out.set(b.subarray(o,o+len),p);
      starts[k++]=p;
      const q=o+h.siOff;
      const mdb=h.mpeg1?(b[q]<<1)|(b[q+1]>>7):b[q];
      if(mdb>avail){silenceFrame(out,p,h);muted++}
      avail+=len-h.siOff-h.si;
      if(brRef<0)brRef=h.brI; else if(h.brI!==brRef)cbr=false;
      p+=len;
    }
  }
  if(x) writeXing(out,h0,x,frames,total,starts,cbr);
  return {bytes:out,frames,muted};
}
/*END CORE*/

const $=id=>document.getElementById(id);
const el=(tag,props={},...kids)=>{const e=Object.assign(document.createElement(tag),props);e.append(...kids);return e};
const BIN=64, RULER=22, MIN_SPAN=.25;
const sources=[]; let cur=null, clips=[], clipSeq=0, nameTouched=false;

function fmt(t){
  t=Math.max(0,t);
  let ms=Math.round(t*1000), h=Math.floor(ms/3600000); ms-=h*3600000;
  const m=Math.floor(ms/60000); ms-=m*60000;
  const s=Math.floor(ms/1000); ms-=s*1000;
  return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')+'.'+String(ms).padStart(3,'0');
}
function parseTime(v){
  v=v.trim(); if(!/^\d+(:\d+){0,2}(\.\d*)?$/.test(v)) return null;
  return v.split(':').reduce((a,x)=>a*60+parseFloat(x),0);
}
function say(msg,err){const s=$('status');s.textContent=msg||'';s.className=err?'err':''}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const mb=n=>(n/1048576).toFixed(n<10485760?2:1)+' MB';

/* ---------- 解碼與波形資料 ---------- */
async function decode(bytes,sr,channels,dur){
  const rate=dur>1800?16000:sr;
  const ctx=new OfflineAudioContext(channels,1,rate);
  return ctx.decodeAudioData(bytes.slice().buffer);
}
function computePeaks(ab){
  const n=Math.ceil(ab.length/BIN), mins=new Float32Array(n), maxs=new Float32Array(n);
  for(let c=0;c<ab.numberOfChannels;c++){
    const d=ab.getChannelData(c);
    for(let i=0;i<d.length;i++){
      const k=i>>6, v=d[i];
      if(v<mins[k])mins[k]=v; if(v>maxs[k])maxs[k]=v;
    }
  }
  return {mins,maxs};
}
async function loadFile(file){
  say('正在讀取「'+file.name+'」…');
  const raw=new Uint8Array(await file.arrayBuffer());
  const s=parseMp3(raw);
  if(!s){say('「'+file.name+'」裡找不到 MP3 音框，請確認它是 MP3 檔。',true);return false}
  try{
    const last=s.n-1;
    s.buffer=await decode(raw.subarray(s.offs[0],s.offs[last]+s.sizes[last]),s.sr,s.mono?1:2,s.dur);
  }catch(e){say('「'+file.name+'」無法解碼，檔案可能損毀或太大。',true);return false}
  s.peaks=computePeaks(s.buffer);
  s.name=file.name; s.id=++clipSeq;
  s.sel={a:0,b:s.n}; s.view={s:0,e:s.dur}; s.head=0;
  sources.push(s); select(s);
  if(!nameTouched&&!clips.length) $('outName').value=s.name.replace(/\.mp3$/i,'')+'_剪接.mp3';
  say('已開啟「'+file.name+'」。'+(s.dur>1800?' 檔案較長，試聽音質較低，匯出不受影響。':''));
  return true;
}
async function loadFiles(list){
  for(const f of list){
    if(/\.mp3$/i.test(f.name)||f.type==='audio/mpeg') await loadFile(f);
    else say('「'+f.name+'」不是 MP3，已略過。',true);
  }
}

/* ---------- 畫面 ---------- */
const wave=$('wave'), ov=$('ov'), stage=$('stage');
const tk={};
function readTokens(){
  const c=getComputedStyle(document.documentElement);
  for(const k of ['wave','mark','head','shade','line','muted','ink']) tk[k]=c.getPropertyValue('--'+k).trim();
  tk.mono=c.getPropertyValue('--mono');
}
function fitCanvas(){
  const dpr=devicePixelRatio||1, w=Math.round(stage.clientWidth*dpr), h=Math.round(stage.clientHeight*dpr);
  for(const c of [wave,ov]){c.width=w;c.height=h}
  drawWave();drawOv();
}
const tickSteps=[.05,.1,.25,.5,1,2,5,10,15,30,60,120,300,600,1800,3600];
function tickLabel(t,step){
  const m=Math.floor(t/60), s=t-m*60;
  if(step<1) return m+':'+s.toFixed(2).padStart(5,'0');
  return m+':'+String(Math.round(s)).padStart(2,'0');
}
function drawWave(){
  const c=wave.getContext('2d'), W=wave.width, H=wave.height, dpr=devicePixelRatio||1;
  c.clearRect(0,0,W,H);
  if(!cur) return;
  const {s,e}=cur.view, span=e-s, top=RULER*dpr, mid=top+(H-top)/2, amp=(H-top)/2*.95;
  const ab=cur.buffer, rate=ab.sampleRate, spp=span*rate/W, {mins,maxs}=cur.peaks;
  c.fillStyle=tk.wave;
  for(let x=0;x<W;x++){
    const i0=Math.floor((s+x/W*span)*rate), i1=Math.max(i0+1,Math.floor((s+(x+1)/W*span)*rate));
    let lo=0,hi=0;
    if(spp<256){
      for(let ch=0;ch<ab.numberOfChannels;ch++){
        const d=ab.getChannelData(ch);
        for(let i=i0;i<i1&&i<d.length;i++){if(d[i]<lo)lo=d[i];if(d[i]>hi)hi=d[i]}
      }
    }else{
      for(let k=i0>>6;k<=(i1-1)>>6&&k<mins.length;k++){if(mins[k]<lo)lo=mins[k];if(maxs[k]>hi)hi=maxs[k]}
    }
    c.fillRect(x,mid-hi*amp,1,Math.max(dpr,(hi-lo)*amp));
  }
  const px=W/span/dpr, fd=cur.frameDur;
  if(fd*px>=6){ // 放得夠大時畫出音框格線，這些線就是能下刀的位置
    c.fillStyle=tk.line;
    for(let f=Math.ceil(s/fd);f*fd<=e;f++) c.fillRect((f*fd-s)/span*W,top,1,H-top);
  }
  const step=tickSteps.find(v=>v*px>=90)||3600;
  c.fillStyle=tk.line; c.fillRect(0,top-1,W,1);
  c.font=(11*dpr)+'px '+tk.mono; c.textBaseline='middle';
  for(let n=Math.ceil(s/step);n*step<=e;n++){
    const t=n*step, x=(t-s)/span*W;
    c.fillStyle=tk.line; c.fillRect(x,top-6*dpr,1,6*dpr);
    c.fillStyle=tk.muted; c.fillText(tickLabel(t,step),x+3*dpr,top/2-2*dpr);
  }
}
function drawOv(){
  const c=ov.getContext('2d'), dpr=devicePixelRatio||1, W=ov.width/dpr, H=ov.height/dpr;
  c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,W,H);
  if(!cur) return;
  const X=t=>(t-cur.view.s)/(cur.view.e-cur.view.s)*W, fd=cur.frameDur;
  const xa=X(cur.sel.a*fd), xb=X(cur.sel.b*fd);
  c.fillStyle=tk.shade;
  c.fillRect(0,RULER,Math.max(0,xa),H-RULER);
  c.fillRect(xb,RULER,Math.max(0,W-xb),H-RULER);
  c.fillStyle=tk.mark;
  c.fillRect(xa,RULER-3,xb-xa,3);
  for(const x of [xa,xb]) c.fillRect(x-1,RULER,2,H-RULER);
  c.fillRect(xa-1,RULER,9,14);
  c.fillRect(xb-8,RULER,9,14);
  c.fillStyle=tk.ink;
  for(const k of clips) if(k.src===cur){
    const x1=X(k.a*fd), x2=X(k.b*fd);
    c.fillRect(x1,H-4,Math.max(2,x2-x1-1),4);
  }
  c.fillStyle=tk.head;
  c.fillRect(X(cur.head)-.75,0,1.5,H);
}
function clampView(){
  const v=cur.view, D=cur.dur;
  const span=clamp(v.e-v.s,Math.min(MIN_SPAN,D),D);
  v.s=clamp(v.s,0,D-span); v.e=v.s+span;
}
function viewChanged(){
  clampView();
  const v=cur.view, D=cur.dur, span=v.e-v.s, zoomed=span<D-1e-6;
  $('panWrap').hidden=!zoomed;
  if(zoomed) $('pan').value=Math.round(v.s/(D-span)*1000);
  drawWave();drawOv();
}
function zoomAt(tc,f){
  const v=cur.view, old=v.e-v.s, span=clamp(old*f,Math.min(MIN_SPAN,cur.dur),cur.dur);
  v.s=tc-(tc-v.s)*(span/old); v.e=v.s+span; viewChanged();
}
function syncSel(){
  if(!cur){$('selLen').textContent='';$('in').value='';$('out').value='';return}
  const {a,b}=cur.sel, fd=cur.frameDur;
  if(document.activeElement!==$('in')) $('in').value=fmt(a*fd);
  if(document.activeElement!==$('out')) $('out').value=fmt(b*fd);
  $('selLen').textContent='長度 '+fmt((b-a)*fd)+'（'+(b-a).toLocaleString()+' 音框）';
}
function renderTabs(){
  const t=$('tabs'); t.replaceChildren();
  for(const s of sources){
    t.append(el('div',{className:'tab'+(s===cur?' on':'')},
      el('button',{textContent:s.name,title:s.name,onclick:()=>select(s)}),
      el('button',{className:'x',textContent:'✕',title:'關閉這個檔案',onclick:()=>closeSource(s)})));
  }
}
function select(s){
  halt(); cur=s;
  $('empty').hidden=!!s;
  for(const id of ['play','playSel','in','out','zoomIn','zoomOut','zoomSel','zoomAll','add','addRest']) $(id).disabled=!s;
  $('meta').textContent=s?[s.name,(s.sr/1000)+' kHz',s.mono?'單聲道':'立體聲',s.kbps+' kbps',fmt(s.dur),'每音框 '+(s.frameDur*1000).toFixed(2)+' ms'].join(' · '):'尚未開啟檔案';
  renderTabs(); syncSel();
  if(s) viewChanged(); else {$('panWrap').hidden=true;drawWave();drawOv()}
}
function closeSource(s){
  const n=clips.filter(c=>c.src===s).length;
  clips=clips.filter(c=>c.src!==s);
  sources.splice(sources.indexOf(s),1);
  if(cur===s) select(sources[sources.length-1]||null); else renderTabs();
  renderClips();
  say('已關閉「'+s.name+'」'+(n?'，並移除成品裡 '+n+' 個來自它的片段。':'。'));
}

/* ---------- 選取操作 ---------- */
let drag=null;
const pos=e=>{const r=ov.getBoundingClientRect();return e.clientX-r.left};
const timeAt=x=>cur.view.s+clamp(x/ov.clientWidth,0,1)*(cur.view.e-cur.view.s);
const frameAt=x=>clamp(Math.round(timeAt(x)/cur.frameDur),0,cur.n);
const xOf=f=>(f*cur.frameDur-cur.view.s)/(cur.view.e-cur.view.s)*ov.clientWidth;
function handleAt(x,touch){
  const g=touch?16:8, da=Math.abs(x-xOf(cur.sel.a)), db=Math.abs(x-xOf(cur.sel.b));
  if(da<=g&&da<=db) return 'a';
  if(db<=g) return 'b';
  return null;
}
ov.addEventListener('pointerdown',e=>{
  if(!cur||e.button) return;
  ov.setPointerCapture(e.pointerId);
  const x=pos(e), h=handleAt(x,e.pointerType==='touch');
  drag=h?{t:h}:{t:'new',x0:x,f0:frameAt(x),moved:false};
});
ov.addEventListener('pointermove',e=>{
  if(!cur) return;
  const x=pos(e);
  if(!drag){ov.style.cursor=handleAt(x,false)?'ew-resize':'crosshair';return}
  const f=frameAt(x), s=cur.sel;
  if(drag.t==='a') s.a=Math.min(f,s.b-1);
  else if(drag.t==='b') s.b=Math.max(f,s.a+1);
  else{
    if(Math.abs(x-drag.x0)>3) drag.moved=true;
    if(!drag.moved) return;
    s.a=Math.min(drag.f0,f); s.b=Math.max(drag.f0,f);
    if(s.b===s.a){if(s.b<cur.n)s.b++;else s.a--}
  }
  syncSel();drawOv();
});
ov.addEventListener('pointerup',e=>{
  if(drag&&drag.t==='new'&&!drag.moved) seek(timeAt(pos(e)));
  drag=null;
});
ov.addEventListener('pointercancel',()=>{drag=null});
ov.addEventListener('wheel',e=>{
  if(!cur) return;
  e.preventDefault();
  const v=cur.view, span=v.e-v.s;
  if(e.shiftKey||Math.abs(e.deltaX)>Math.abs(e.deltaY)){
    const d=(e.deltaX||e.deltaY)/ov.clientWidth*span; v.s+=d; v.e+=d; viewChanged();
  }else zoomAt(timeAt(pos(e)),e.deltaY<0?.8:1.25);
},{passive:false});
$('pan').addEventListener('input',e=>{
  const v=cur.view, span=v.e-v.s; v.s=e.target.value/1000*(cur.dur-span); v.e=v.s+span; drawWave();drawOv();
});
$('zoomIn').onclick=()=>zoomAt(cur.head>=cur.view.s&&cur.head<=cur.view.e?cur.head:(cur.view.s+cur.view.e)/2,.5);
$('zoomOut').onclick=()=>zoomAt((cur.view.s+cur.view.e)/2,2);
$('zoomAll').onclick=()=>{cur.view={s:0,e:cur.dur};viewChanged()};
$('zoomSel').onclick=()=>{
  const fd=cur.frameDur,a=cur.sel.a*fd,b=cur.sel.b*fd,m=(b-a)*.05;
  cur.view={s:a-m,e:b+m};viewChanged();
};
function setIn(f){if(cur){cur.sel.a=clamp(f,0,cur.sel.b-1);syncSel();drawOv()}}
function setOut(f){if(cur){cur.sel.b=clamp(f,cur.sel.a+1,cur.n);syncSel();drawOv()}}
for(const [id,apply,key] of [['in',setIn,'a'],['out',setOut,'b']]){
  const inp=$(id);
  inp.addEventListener('change',()=>{
    const t=parseTime(inp.value);
    if(t===null) say('時間格式請用 1:23.456 或 83.456。',true);
    else{apply(Math.round(t/cur.frameDur));say('')}
  });
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter') inp.blur();
    else if(e.key==='ArrowUp'||e.key==='ArrowDown'){
      e.preventDefault(); apply(cur.sel[key]+(e.key==='ArrowUp'?1:-1));
      inp.value=fmt(cur.sel[key]*cur.frameDur);
    }
  });
  inp.addEventListener('blur',()=>setTimeout(syncSel));
}

/* ---------- 播放 ---------- */
const P={ctx:null,node:null,raf:0,mode:null};
function halt(){
  if(P.node){P.node.onended=null;try{P.node.stop()}catch(e){}P.node.disconnect();P.node=null}
  cancelAnimationFrame(P.raf); P.mode=null; setHighlight(-1);
  const h=$('stripHead'); if(h) h.hidden=true;
  updatePlayButtons();
}
function updatePlayButtons(){
  $('play').textContent=P.mode==='file'?'❚❚ 暫停':'▶ 播放';
  $('playSel').textContent=P.mode==='sel'?'❚❚ 停止試聽':'試聽選取';
  $('preview').textContent=P.mode==='out'?'❚❚ 停止試聽':'試聽成品';
}
function playBuf(buf,from,to,mode,tick,done){
  halt();
  P.ctx=P.ctx||new AudioContext(); P.ctx.resume();
  const n=P.ctx.createBufferSource(); n.buffer=buf; n.connect(P.ctx.destination);
  n.start(0,from,Math.max(.001,to-from));
  P.node=n; P.mode=mode; const t0=P.ctx.currentTime-from;
  n.onended=()=>{P.node=null;cancelAnimationFrame(P.raf);P.mode=null;setHighlight(-1);updatePlayButtons();done&&done()};
  updatePlayButtons();
  const loop=()=>{if(!P.node)return;tick(P.ctx.currentTime-t0);P.raf=requestAnimationFrame(loop)};
  loop();
}
function followHead(){
  const v=cur.view, span=v.e-v.s;
  if(!drag&&(cur.head>v.e||cur.head<v.s)){v.s=cur.head;v.e=v.s+span;viewChanged()}else drawOv();
}
function playFile(from){
  const s=cur;
  if(from>=s.dur-.01) from=0;
  playBuf(s.buffer,from,s.buffer.duration,'file',t=>{s.head=t;if(s===cur)followHead()},()=>{s.head=0;if(s===cur)drawOv()});
}
function seek(t){
  cur.head=clamp(t,0,cur.dur);
  if(P.mode==='file') playFile(cur.head); else drawOv();
}
function togglePlay(){if(!cur)return;if(P.mode==='file')halt();else playFile(cur.head)}
function togglePlaySel(){
  if(!cur)return;
  if(P.mode==='sel'){halt();return}
  const s=cur, a=s.sel.a*s.frameDur, b=s.sel.b*s.frameDur;
  playBuf(s.buffer,a,b,'sel',t=>{s.head=t;if(s===cur)followHead()},()=>{s.head=a;if(s===cur)drawOv()});
}
$('play').onclick=togglePlay;
$('playSel').onclick=togglePlaySel;

/* ---------- 成品清單 ---------- */
const tapeColors=['--tape1','--tape2','--tape3','--tape4'];
function canJoin(s){
  const r=clips.length?clips[0].src:null;
  if(!r||(r.sr===s.sr&&r.ver===s.ver&&r.mono===s.mono)) return true;
  say('這段是 '+(s.sr/1000)+' kHz '+(s.mono?'單聲道':'立體聲')+'，成品是 '+(r.sr/1000)+' kHz '+(r.mono?'單聲道':'立體聲')+'。規格不同的 MP3 無法無損接在一起。',true);
  return false;
}
function pushClips(list){
  if(!canJoin(cur)) return false;
  clips.push(...list); renderClips(); drawOv();
  return true;
}
function addSel(){
  if(!cur) return;
  if(pushClips([{id:++clipSeq,src:cur,a:cur.sel.a,b:cur.sel.b}])) say('已加入 '+fmt((cur.sel.b-cur.sel.a)*cur.frameDur)+'。');
}
function addRest(){
  const {a,b}=cur.sel, list=[];
  if(a>0) list.push({id:++clipSeq,src:cur,a:0,b:a});
  if(b<cur.n) list.push({id:++clipSeq,src:cur,a:b,b:cur.n});
  if(!list.length){say('目前選了整個檔案，挖掉後沒有內容。請先縮小選取範圍。',true);return}
  if(pushClips(list)) say('已挖掉 '+fmt((b-a)*cur.frameDur)+'，加入前後 '+list.length+' 段。');
}
$('add').onclick=addSel;
$('addRest').onclick=addRest;
let dragClip=-1;
function moveClip(from,to){
  if(to<0||to>=clips.length||from===to) return;
  const [c]=clips.splice(from,1); clips.splice(to,0,c); renderClips();
}
const clipTime=c=>(c.b-c.a)*c.src.frameDur;
function renderClips(){
  if(P.mode==='out') halt();
  const list=$('clips'), strip=$('strip'); list.replaceChildren(); strip.replaceChildren();
  const hues=new Map(); let total=0;
  clips.forEach((c,i)=>{
    if(!hues.has(c.src)) hues.set(c.src,tapeColors[hues.size%tapeColors.length]);
    const color='var('+hues.get(c.src)+')', fd=c.src.frameDur;
    total+=clipTime(c);
    strip.append(el('i',{style:'flex:'+clipTime(c)+' 1 0;background:'+color,title:c.src.name}));
    const li=el('li',{draggable:true},
      el('span',{className:'n',textContent:i+1}),
      el('button',{className:'name',textContent:c.src.name,title:'回到波形上的這段',onclick:()=>{
        if(cur!==c.src) select(c.src);
        cur.sel={a:c.a,b:c.b}; cur.head=c.a*fd; syncSel(); viewChanged();
      }}),
      el('span',{className:'time',textContent:fmt(c.a*fd)+' – '+fmt(c.b*fd)+'  ('+fmt(clipTime(c))+')'}),
      el('span',{className:'ops'},
        el('button',{textContent:'↑',title:'往前',disabled:i===0,onclick:()=>moveClip(i,i-1)}),
        el('button',{textContent:'↓',title:'往後',disabled:i===clips.length-1,onclick:()=>moveClip(i,i+1)}),
        el('button',{textContent:'✕',title:'移除',onclick:()=>{clips.splice(i,1);renderClips();drawOv()}})));
    li.addEventListener('dragstart',()=>{dragClip=i});
    li.addEventListener('dragend',()=>{dragClip=-1});
    li.addEventListener('dragover',e=>{if(dragClip<0)return;e.preventDefault();li.classList.add('over')});
    li.addEventListener('dragleave',()=>li.classList.remove('over'));
    li.addEventListener('drop',e=>{if(dragClip<0)return;e.preventDefault();li.classList.remove('over');moveClip(dragClip,i);dragClip=-1});
    list.append(li);
  });
  strip.append(el('div',{id:'stripHead',hidden:true}));
  $('noClips').hidden=clips.length>0;
  $('total').textContent=clips.length?clips.length+' 段，共 '+fmt(total):'';
  $('preview').disabled=$('export').disabled=!clips.length;
}
function setHighlight(i){
  [...$('clips').children].forEach((li,k)=>li.classList.toggle('now',k===i));
}
async function togglePreview(){
  if(P.mode==='out'){halt();return}
  if(!clips.length) return;
  say('正在組合成品…');
  const r=buildExport(clips), s0=clips[0].src;
  const total=clips.reduce((a,c)=>a+clipTime(c),0);
  let buf;
  try{buf=await decode(r.bytes,s0.sr,s0.mono?1:2,total)}
  catch(e){say('成品無法解碼，請試著移除最後加入的片段。',true);return}
  const ends=[];let acc=0;for(const c of clips){acc+=clipTime(c);ends.push(acc)}
  say('');
  playBuf(buf,0,buf.duration,'out',t=>{
    const head=$('stripHead');
    head.hidden=false;
    head.style.left=clamp(t/total,0,1)*$('strip').clientWidth+'px';
    setHighlight(ends.findIndex(x=>t<x));
  },()=>{$('stripHead').hidden=true});
}
$('preview').onclick=togglePreview;
$('outName').addEventListener('input',()=>{nameTouched=true});
$('export').onclick=()=>{
  if(!clips.length) return;
  const r=buildExport(clips);
  let name=($('outName').value.trim()||'剪接.mp3').replace(/[\\/:*?"<>|]/g,'_');
  if(!/\.mp3$/i.test(name)) name+='.mp3';
  const url=URL.createObjectURL(new Blob([r.bytes],{type:'audio/mpeg'}));
  const a=el('a',{href:url,download:name}); document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  const total=clips.reduce((x,c)=>x+clipTime(c),0);
  say('已匯出「'+name+'」，'+fmt(total)+'，'+mb(r.bytes.length)+'。');
};

/* ---------- 全域事件 ---------- */
$('open').onclick=()=>$('file').click();
$('file').addEventListener('change',e=>{loadFiles([...e.target.files]);e.target.value=''});
let dragDepth=0;
const hasFiles=e=>[...e.dataTransfer.types].includes('Files');
addEventListener('dragenter',e=>{if(hasFiles(e)){dragDepth++;document.body.classList.add('dropping')}});
addEventListener('dragleave',e=>{if(hasFiles(e)&&--dragDepth<=0){dragDepth=0;document.body.classList.remove('dropping')}});
addEventListener('dragover',e=>{if(hasFiles(e))e.preventDefault()});
addEventListener('drop',e=>{
  if(!hasFiles(e)) return;
  e.preventDefault(); dragDepth=0; document.body.classList.remove('dropping');
  loadFiles([...e.dataTransfer.files]);
});
document.addEventListener('click',e=>{if(e.detail>0){const b=e.target.closest('button');if(b)b.blur()}});
addEventListener('keydown',e=>{
  if(!cur||e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,button,textarea,select')) return;
  const f=Math.round(cur.head/cur.frameDur), k=e.key.toLowerCase();
  if(k===' '){e.preventDefault();togglePlay()}
  else if(k==='i') setIn(f);
  else if(k==='o') setOut(f);
  else if(k==='a') addSel();
  else if(k==='arrowleft'||k==='arrowright'){
    e.preventDefault();
    const step=e.shiftKey?Math.round(1/cur.frameDur):1;
    seek(clamp(f+(k==='arrowleft'?-step:step),0,cur.n)*cur.frameDur);
    followHead();
  }
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readTokens();drawWave();drawOv()});
readTokens();
new ResizeObserver(fitCanvas).observe(stage);
$('outName').value='剪接.mp3';
renderClips();
</script>
</body>
</html>
